<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Витрина мини-приложений</title>
<link rel="icon" href="data:,">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: dark "premium" Telegram Mini App — Telegram header, bento tiles with gradient glow + Fluent Emoji 3D icons (prototype/icons), blue MainButton. Always dark (ref: design/refs/01) */
:root{
  --page:#0B0D12; --cell:#171A21; --cell2:#1E222B; --head:#0B0D12;
  --text:#FFFFFF; --hint:#8B90A0; --link:#5B9BFF;
  --btn:#2F6BFF; --btn-text:#FFFFFF; --sep:rgb(255 255 255 / .08); --line:rgb(255 255 255 / .06);
  --soft:#18284A; --gold:#F5B342; --danger:#FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:radial-gradient(120% 420px at 50% -120px,#17223D 0%,transparent 70%) no-repeat,var(--page);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* simulated Telegram header (hidden inside real Telegram) */
.tgh{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgb(11 13 18 / .88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:90px 1fr 90px;align-items:center;height:54px;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
.tgh .l,.tgh .r{color:var(--text);font-size:16px;display:flex;align-items:center;gap:4px}
.tgh .r{justify-content:flex-end}
.tgh .r i{width:26px;height:26px;border:1.5px solid var(--text);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;letter-spacing:1px;line-height:1}
.tgh .c{text-align:center;min-width:0}
.tgh .c b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgh .c span{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-tg .tgh{display:none}

/* home: brand row, bento */
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 0}
.logo{width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(145deg,#2A3350,#1A2036);border:1px solid var(--line);display:grid;place-items:center;font-size:28px;box-shadow:0 6px 18px -6px #F59E0B99}
.top-t{min-width:0}
.top-t b{display:block;font-size:17px;font-weight:600;text-wrap:balance}
.top-t span{font-size:13px;color:var(--hint)}
.bento{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px 16px 0}
.tile{grid-column:span 2;position:relative;overflow:hidden;height:136px;border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;
  background:radial-gradient(130% 100% at 100% 100%,var(--g) 0%,transparent 62%),linear-gradient(160deg,#1C2029,#14171D);border:1px solid var(--line)}
.tile.w{grid-column:span 3}.tile.full{grid-column:span 5;height:112px}
.tile::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgb(255 255 255 / .07) 1px,transparent 1.6px);background-size:14px 14px;
  -webkit-mask-image:linear-gradient(200deg,#000,transparent 70%);mask-image:linear-gradient(200deg,#000,transparent 70%);pointer-events:none}
.tile .k{font-size:13px;color:var(--hint);position:relative}
.tile b{font-size:20px;font-weight:600;line-height:1.15;margin-top:2px;max-width:72%;position:relative;text-wrap:balance}
.tile .d{font-size:13px;color:var(--hint);margin-top:4px;max-width:62%;position:relative}
.tile .em{position:absolute;right:-4px;bottom:-12px;font-size:78px;line-height:1;transform:rotate(-12deg);filter:drop-shadow(0 10px 18px rgb(0 0 0 / .55))}
.tile.full .em{font-size:70px;right:10px;bottom:-8px}

/* sections & cells */
.sec{margin:24px 16px 0}
.sec-h{font-size:18px;font-weight:600;color:var(--text);padding:0 4px 10px}
.sec-f{font-size:13px;color:var(--hint);padding:8px 4px 0;line-height:1.35}
.grp{background:var(--cell);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 16px;width:100%;text-align:left;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:1px solid var(--sep)}
.cell.ic + .cell::before,.cell.ic + .cell.ic::before{left:62px}
.cell .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:24px;flex:none;color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255 / .2)}
.cell .tx{flex:1;min-width:0}
.cell .tx b{font-weight:500;display:block}
.cell .tx span{display:block;font-size:14px;color:var(--hint);margin-top:1px}
.cell .val{color:var(--hint);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .chev{color:var(--hint);font-size:20px;line-height:1;opacity:.6}
.cell.link .tx b{color:var(--link)}
.price{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}


/* price summary card (repair) */
.sum{position:relative;overflow:hidden;margin:16px 16px 0;padding:16px;border-radius:20px;border:1px solid var(--line);
  background:radial-gradient(120% 130% at 100% 0%,#F5B34259 0%,transparent 55%),linear-gradient(160deg,#1C2029,#14171D)}
.sum span{font-size:13px;color:var(--hint);position:relative}
.sum b{display:block;font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px;position:relative}
.sum .em{position:absolute;right:6px;top:-2px;font-size:66px;color:inherit;transform:rotate(12deg);filter:drop-shadow(0 10px 18px rgb(0 0 0 / .5))}

/* option cards (repair works) */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;background:var(--cell);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.opt .em{font-size:34px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 6px 10px rgb(0 0 0 / .45))}
.opt b{font-weight:600;font-size:15px;line-height:1.2}
.opt .pr{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.opt .ck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid #4A5060;display:grid;place-items:center;font-size:13px;color:#fff}
.opt[aria-pressed="true"]{border-color:var(--btn);background:linear-gradient(160deg,#1B2D5C,#171A21)}
.opt[aria-pressed="true"] .ck{background:var(--btn);border-color:var(--btn)}
.opt[aria-pressed="true"] .ck::after{content:"✓"}
img.ic3d{width:1em;height:1em;display:block;object-fit:contain}
.numin{width:76px;text-align:right;border:0;background:var(--cell2);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;font-weight:600;outline:none;font-size:16px}
.numin:focus{box-shadow:0 0 0 2px var(--btn)}
.num{display:flex;align-items:center;gap:6px;color:var(--hint)}
.dims .numin{width:64px}.dims .x{color:var(--hint)}
.opts.three{grid-template-columns:repeat(3,1fr);gap:8px}
.opts.three .opt{padding:12px 10px}.opts.three .opt b{font-size:14px}.opts.three .opt .ck{top:10px;right:10px;width:20px;height:20px}
.sum span + b + span{display:block;margin-top:4px}

/* switch, stepper, chip-tabs */
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#3A3F4B;position:relative;flex:none;transition:background .2s;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgb(0 0 0 / .3);transition:transform .2s}
.sw:checked{background:var(--btn)}
.sw:checked::after{transform:translateX(20px)}
.stp{display:flex;align-items:center;background:var(--cell2);border-radius:12px;overflow:hidden;flex:none}
.stp button{width:40px;height:34px;font-size:20px;color:var(--text)}
.stp span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--hint);padding:0 2px;font-variant-numeric:tabular-nums}
.segc{display:flex;gap:8px;margin:16px 16px 0;overflow-x:auto;scrollbar-width:none}
.segc::-webkit-scrollbar{display:none}
.segc button{flex:1 0 auto;padding:10px 14px;border-radius:14px;background:var(--cell);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.segc button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600;box-shadow:0 8px 18px -10px var(--btn)}
input[type=range]{width:100%;accent-color:var(--btn);margin:0}
.inp{border:0;background:transparent;width:100%;padding:14px 16px;outline:none;font-size:16px}
.inp::placeholder{color:var(--hint)}
select.inp{appearance:none;-webkit-appearance:none}
.inpcell{position:relative}
.inpcell + .inpcell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:1px solid var(--sep)}

/* food grid */
.food{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 16px 0}
.fi{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;background:var(--cell);border:1px solid var(--line);border-radius:18px;padding:12px 8px 10px}
.fi .em{width:92px;height:92px;display:grid;place-items:center;font-size:92px;line-height:1;margin-top:-4px;filter:drop-shadow(0 10px 14px rgb(0 0 0 / .55))}
.fi .nm{font-size:13px;line-height:1.2;min-height:2.4em}
.fi .pr{font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.fi .add{background:var(--btn);color:#fff;font-weight:600;font-size:13px;border-radius:10px;padding:7px 0;width:100%;margin-top:2px}
.fi .pm{display:flex;gap:4px;width:100%;margin-top:2px}
.fi .pm button{flex:1;border-radius:10px;padding:7px 0;font-weight:700;color:#fff}
.fi .pm .mi{background:var(--cell2)}.fi .pm .pl{background:var(--btn)}
.fi .badge{position:absolute;top:8px;right:8px;background:var(--gold);color:#1A1205;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.fi.off{opacity:.4}

/* rent */
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.gal .gi{flex:0 0 80%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;scroll-snap-align:center;position:relative;border:1px solid var(--line);display:block;padding:0}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .gi .ph{height:100%}.gal .gi .tag{position:absolute;left:12px;bottom:12px;background:rgb(0 0 0 / .5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:5px 10px}
.lb{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:12px}.lb span{color:#fff;font-size:15px}
.ph{height:170px;position:relative;display:flex;align-items:flex-end;padding:12px;overflow:hidden}
.ph .tag{background:rgb(0 0 0 / .5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:5px 10px;position:relative}
.ph .em{position:absolute;right:14px;top:50%;transform:translateY(-55%) rotate(-8deg);font-size:84px;line-height:1;filter:drop-shadow(0 12px 18px rgb(0 0 0 / .45))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 12px 12px;text-align:center}
.cal .dw{font-size:12px;color:var(--hint);padding-block:4px}
.cal button{height:40px;border-radius:20px;font-size:16px;font-variant-numeric:tabular-nums}
.cal button.in{background:var(--soft);border-radius:0}
.cal button.busy{text-decoration:line-through;color:var(--hint);opacity:.45;pointer-events:none}
.cal button.edge{background:var(--btn);color:var(--btn-text)}

/* MainButton (simulated) */
.mb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--page) 72%,transparent);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mb button{display:block;max-width:448px;margin:0 auto;width:100%;height:52px;border-radius:14px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600;box-shadow:0 10px 24px -12px var(--btn)}
.mb button:disabled{background:#2A2E38;color:#7C8190;box-shadow:none;cursor:not-allowed}
.in-tg .mb{display:none}

.tgmsg{margin:12px 12px 0;padding:10px 14px;background:var(--cell2);border-radius:16px 16px 16px 6px;white-space:pre-line;line-height:1.45;font-size:15px}
.tgmsg .from{display:block;font-size:13px;font-weight:600;color:var(--link);margin-bottom:2px}
.tgkb{padding:6px 12px 12px}.tgkb button,.tgkb span{display:block;width:100%;padding:10px;border-radius:12px;background:var(--soft);color:var(--link);font-weight:600;text-align:center;font-size:15px}
.tgkb span{background:none;color:#4ADE80}
.cell .when{font-weight:400;font-size:13px;color:var(--hint)}
.st{font-size:13px;padding:3px 8px;border-radius:8px;background:var(--cell2);color:var(--hint)}.st.new{background:var(--soft);color:var(--link)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:64px 24px 0}
.done .ok{width:104px;height:104px;border-radius:32px;background:linear-gradient(145deg,#4ADE80,#16A34A);color:#fff;display:grid;place-items:center;font-size:52px;box-shadow:0 16px 36px -12px #22C55E}
.done h2{font-size:24px;font-weight:700;margin-top:8px}
.done p{color:var(--hint);max-width:32ch}
.err{color:var(--danger);font-size:14px;padding:8px 20px 0}
.note{margin:18px 16px 0;font-size:13px;color:var(--hint);text-align:center}

/* admin */
.fld{display:block;padding:10px 16px 2px;position:relative}
.fld + .fld::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:1px solid var(--sep)}
.fld span{display:block;font-size:12px;color:var(--hint)}
.fld .inp{padding:4px 0 10px}
.ed{width:84px;flex:none;text-align:right;border:0;background:var(--cell2);border-radius:10px;padding:8px 9px;font-variant-numeric:tabular-nums;font-weight:600;outline:none;font-size:16px}
.ed:focus,.edn:focus{box-shadow:0 0 0 2px var(--btn)}
.edn{flex:1;min-width:0;border:0;background:transparent;padding:6px 4px;border-radius:8px;font-size:16px;outline:none}
.cell .u{color:var(--hint);font-size:14px}
.arow{gap:8px}.arow .ai{font-size:24px;flex:none}
.mv{display:flex;gap:4px;flex:none}
.mv button{width:32px;height:32px;border-radius:9px;background:var(--cell2);font-size:15px}
.mv button:disabled{opacity:.3}
.arow .del{width:32px;height:32px;border-radius:9px;background:var(--cell2);color:#FF6B6B;font-size:18px;flex:none}
.amsg{margin:14px 16px 0;padding:12px 14px;border-radius:14px;font-size:14px}
.amsg.ok{background:#22C55E26;color:#4ADE80}.amsg.err{background:#FF6B6B26;color:var(--danger)}
@media (prefers-reduced-motion:no-preference){.scr{animation:sl .22s ease-out}@keyframes sl{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (max-width:350px){.tile b{font-size:17px}.tile .em{font-size:64px}}
</style></head><body>

<div class="app">
  <header class="tgh" id="tgh"></header>
  <main id="app"></main>
</div>
<div class="mb" id="mb"><button id="mbb" type="button">Продолжить</button></div>

<script>
/* Логика витрины. Тексты и цены — в data.json на сайте (правит админка) или data.js (исходник), здесь их не меняйте. */
const ADMIN_API='https://functions.yandexcloud.net/d4ecqonkgf6dhc15g88r'; // Cloud Function «showcase-admin» (admin/function)
function showMsg(t){document.getElementById('app').innerHTML='<div class="note" style="margin-top:80px">'+t+'</div>';document.getElementById('mb').style.display='none'}
// Данные: data.json с сайта (актуальные, их меняет админка); если его нет (локально) — data.js. Всегда без кэша.
(function(){const v='?v='+Date.now();
 const viaScript=()=>{const s=document.createElement('script');s.src='data.js'+v;s.onload=start;
  s.onerror=()=>showMsg('Не удалось загрузить данные витрины. Проверьте интернет и откройте ещё раз.');document.head.appendChild(s)};
 if(location.protocol==='file:')return viaScript();
 fetch('data.json'+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{window.SHOWCASE=d;start()}).catch(viaScript)})();
function start(){
let D=window.SHOWCASE;
if(!D||!D.home||!D.repair||!D.lunch||!D.rent||!D.build)return showMsg('Ошибка в data.js: проверьте запятые, кавычки и скобки рядом с последней правкой.');
const TG=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData?window.Telegram.WebApp:null;
if(TG){document.documentElement.classList.add('in-tg');TG.ready();TG.expand();
  try{TG.setHeaderColor('#0B0D12');TG.setBackgroundColor('#0B0D12');if(TG.setBottomBarColor)TG.setBottomBarColor('#0B0D12')}catch(e){}}
function openChat(){const u='https://t.me/'+D.contact;if(TG)TG.openTelegramLink(u);else window.open(u,'_blank')}
const rub=n=>Math.round(+n||0).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Ремонт: новые поля (натяжной потолок, режимы) могут отсутствовать в живом data.json — подставляем значения по умолчанию
function normRepair(r){const df={lampsStart:6,lampMax:20,chandelierPrice:600,chandelierMax:10,cornicePrice:500,corniceStart:3,ledPrice:1200,ledStart:5,modeOne:'Один вид работ',modeAll:'Комплексный ремонт'};
 for(const k in df)if(r[k]==null||r[k]==='')r[k]=df[k];return r}
let R=normRepair(D.repair),L=D.lunch,A=D.rent,B=normBuild(D.build);
const clone=o=>JSON.parse(JSON.stringify(o));
let IS_OWNER=false;
const U={bld:{house:null,ex:{},opt:{},terr:0,w:0,l:0},scr:'home',stack:[],rep:{mode:'one',work:R.works[0].id,sel:{},it:{},area:R.areaStart},adm:{tab:'home',bh:0,draft:null,dirty:false,saving:false,msg:''},cart:{},cat:'Все',sv:{},
  flat:null,start:null,end:null,guests:2,done:null,err:''};

const $=id=>document.getElementById(id);
function go(s){if(U.scr!==s)U.stack.push(U.scr);U.scr=s;U.err='';render();window.scrollTo(0,0)}
function back(){U.scr=U.stack.pop()||'home';U.err='';render();window.scrollTo(0,0)}
function home(){U.stack=[];U.scr='home';U.err='';render();window.scrollTo(0,0)}
function finish(h,p,x){U.done={h,p,...x};U.cart={};U.stack=[];U.scr='done';render();window.scrollTo(0,0);if(TG&&TG.HapticFeedback)TG.HapticFeedback.notificationOccurred('success')}
// значок: имя файла из icons/ → картинка; иначе — текст (эмодзи)
// ICON_VER — поднять при замене картинок с теми же именами (иначе Telegram сутки показывает старые)
const ICON_VER='2';
const ic=v=>/^[a-z0-9_]+$/.test(v||'')?`<img class="ic3d" src="icons/${v}.png?v=${ICON_VER}" alt="" decoding="async">`:esc(v||'');
const fmtA=a=>(+a).toLocaleString('ru-RU',{maximumFractionDigits:1});
const target=o=>o==='chat'?'data-act="chat"':`data-go="${esc(o)}"`;

const sec=(h,inner,f)=>`<div class="sec">${h?`<div class="sec-h">${h}</div>`:''}<div class="grp">${inner}</div>${f?`<div class="sec-f">${f}</div>`:''}</div>`;

function rIt(id){return U.rep.it[id]||(U.rep.it[id]={area:U.rep.area,L:'',W:'',demont:false,rough:false,lampsOn:true,lamps:R.lampsStart,chand:0,cornOn:false,corn:R.corniceStart,ledOn:false,led:R.ledStart})}

function workSum(w){const s=rIt(w.id);let t=(w.price+(s.demont?R.demolitionPrice:0)+(s.rough?R.materialsPrice:0))*s.area;
 if(w.lamps)t+=(s.lampsOn?s.lamps*R.lampPrice:0)+s.chand*R.chandelierPrice+(s.cornOn?s.corn*R.cornicePrice:0)+(s.ledOn?s.led*R.ledPrice:0);return t}
function repTotal(){const ws=repWorks();return{t:ws.reduce((a,w)=>a+workSum(w),0),ws}}
function repDet(w){const s=rIt(w.id),d=[];if(w.lamps){if(s.lampsOn)d.push(s.lamps+' '+pl(s.lamps,'светильник','светильника','светильников'));if(s.chand)d.push('под люстру: '+s.chand);if(s.cornOn)d.push('карниз '+s.corn+' м');if(s.ledOn)d.push('лента '+s.led+' м')}
 if(s.demont)d.push('демонтаж');if(s.rough)d.push('материалы');return d.join(', ')}

function repArea(w,label){const s=rIt(w.id),id=esc(w.id);return`<div class="cell"><span class="tx"><b>${label}</b></span><span class="num"><input class="numin" data-w="${id}" data-k="n" type="text" inputmode="decimal" value="${fmtA(s.area)}" aria-label="Площадь, м²"><span>м²</span></span></div>

 <div class="cell dims"><span class="tx"><b>По размерам</b><span>длина × ширина, м</span></span><input class="numin" data-w="${id}" data-k="L" type="text" inputmode="decimal" placeholder="0" value="${esc(s.L)}" aria-label="Длина, м"><span class="x">×</span><input class="numin" data-w="${id}" data-k="W" type="text" inputmode="decimal" placeholder="0" value="${esc(s.W)}" aria-label="Ширина, м"></div>`}
function repExtras(w){const s=rIt(w.id),id=esc(w.id);return(w.lamps?
  rSw(id,'lampsOn',s.lampsOn,'Точечные светильники',rub(R.lampPrice)+' за шт.')+(s.lampsOn?rStp(id,'lamps',s.lamps,'Количество светильников','до '+R.lampMax+' шт.'):'')+
  rStp(id,'chand',s.chand,'Закладные под люстру',rub(R.chandelierPrice)+' за шт.')+
  rSw(id,'cornOn',s.cornOn,'Закладные под карниз',s.cornOn?'требуется · '+rub(R.cornicePrice)+' за м':'не требуется')+(s.cornOn?rStp(id,'corn',s.corn,'Длина карниза, м',''):'')+

// Обеды — на ближайший рабочий день, приём до L.orderDeadline накануне (дата и время — с телефона клиента)
function lunchPlan(){const now=new Date(),[h,m]=(L.orderDeadline||'19:00').split(':').map(Number),d=new Date(now);d.setHours(0,0,0,0);let dl;
 for(;;){d.setDate(d.getDate()+1);dl=new Date(d);dl.setDate(dl.getDate()-1);dl.setHours(h,m,0,0);if(d.getDay()%6&&now<dl)break}
 const tmr=new Date(now);tmr.setDate(tmr.getDate()+1);const dm=x=>x.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
 return{day:(d.toDateString()===tmr.toDateString()?'завтра':d.toLocaleDateString('ru-RU',{weekday:'long'}))+', '+dm(d),
  until:`до ${h}:${String(m).padStart(2,'0')} ${dl.toDateString()===now.toDateString()?'сегодня':dm(dl)}`}}
const lunchDay=()=>lunchPlan().day;
const lunchWin=()=>'с '+(L.deliveryWindow||'12:00–15:00').replace('–',' до ');

// В рабочей версии — из броней на сервере и календарей других площадок
function busyDays(f){const set=new Set();let src=f.busy;
 if(src==null){const h=[...String(f.id)].reduce((a,c)=>a*31+c.charCodeAt(0),7);src=`${3+h%4}-${5+h%4}, ${11+h%5}, ${17+h%3}-${19+h%3}`}
 String(src).split(/,\s*/).forEach(r=>{const[a,b]=r.split('-').map(Number);if(a>=0)for(let i=a;i<=(b>=a?b:a);i++)set.add(i)});return set}

function normBuild(b){const cp=o=>JSON.parse(JSON.stringify(o));(b.houses||[]).forEach(h=>{
 if(!h.groups)h.groups=cp(b.options||[]).map(g=>({...g,show:true,items:g.items.map(i=>({...i,show:true}))}));
 if(!h.extras)h.extras=cp(b.extras||[]).map(x=>({...x,show:true}));
 if(!h.terrace)h.terrace={show:true,depths:b.terraceDepths||'2, 3, 4',pricePerM2:b.terracePricePerM2||0}});return b}

const hTerr=h=>h.terrace&&h.terrace.show!==false?h.terrace:null;

const fm=x=>String(+(+x).toFixed(2)).replace('.',',');

const optSel=g=>vis(g.items).find(i=>i.id===U.bld.opt[g.id])||vis(g.items)[0];
function bldPick(h){const w=nums(h.widths),l=nums(h.lengths),d=nums(hTerr(h)?.depths);
 const b=U.bld={house:h.id,ex:{},opt:{},w:w[0]||0,l:l[0]||0,terr:'none',td:d[0]||0};
 hGroups(h).forEach(g=>{const it=vis(g.items);b.opt[g.id]=g.id==='found'&&it.some(i=>i.id===h.foundation)?h.foundation:it[0].id})}
const terrArea=()=>{const b=U.bld;return b.terr==='none'||!hTerr(house())?0:(b.terr==='w'?b.w:b.l)*b.td};
function bldTotal(){const h=house(),a=U.bld.w*U.bld.l;let per=h.pricePerM2||0;hGroups(h).forEach(g=>per+=optSel(g).pricePerM2||0);
 let t=a*per+terrArea()*((hTerr(h)||{}).pricePerM2||0);vis(h.extras).forEach(x=>{if(U.bld.ex[x.id])t+=x.price});return{t,h,a}}

/* ---------- helpers ---------- */
const val=id=>($(id)||{}).value||'';
// Телефон РФ: ровно 11 цифр, начинается с 7 (8 заменяем на 7); при вводе — маска +7 (999) 123-45-67
const phoneOk=v=>/^7\d{10}$/.test(v.replace(/\D/g,''));
function phoneMask(v){let d=v.replace(/\D/g,'');if(!d)return'';if(d[0]==='8')d='7'+d.slice(1);else if(d[0]!=='7')d='7'+d;d=d.slice(0,11);
 const p=[d.slice(1,4),d.slice(4,7),d.slice(7,9),d.slice(9,11)];return'+7'+(p[0]?` (${p[0]}`:'')+(p[1]?`) ${p[1]}`:'')+(p[2]?`-${p[2]}`:'')+(p[3]?`-${p[3]}`:'')}
function fail(m){U.err=m;const keep={};document.querySelectorAll('input[id],select[id]').forEach(e=>keep[e.id]=e.type==='checkbox'?e.checked:e.value);render();for(const k in keep){const e=$(k);if(e){if(e.type==='checkbox')e.checked=keep[k];else e.value=keep[k]}}if(TG&&TG.HapticFeedback)TG.HapticFeedback.notificationOccurred('error')}
function dayL(i){const d=new Date();d.setDate(d.getDate()+i);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function nextDays(n){return Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})})}
function fmtD(i){const d=new Date();d.setDate(d.getDate()+i);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function pl(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c}

let curMain=null;
function render(){const v=scr[U.scr]();const isHome=U.scr==='home';
 $('tgh').innerHTML=`<button class="l" data-act="${isHome?'':'back'}" aria-label="${isHome?'Закрыть':'Назад'}">${isHome?'Закрыть':'‹ Назад'}</button><div class="c"><b>${esc(v.title)}</b>${v.sub?`<span>${esc(v.sub)}</span>`:''}</div><span class="r" aria-hidden="true"><i>⋯</i></span>`;
 $('app').innerHTML=`<div class="scr">${v.html}</div>`;
 setMain(v.main);
 if(TG)isHome?TG.BackButton.hide():TG.BackButton.show();
}
function setMain(m){curMain=m;const b=$('mbb');b.textContent=m.text;b.disabled=!!m.disabled;
 if(TG){const M=TG.MainButton;M.setParams(m.disabled?{color:'#2A2E38',text_color:'#7C8190'}:{color:'#2F6BFF',text_color:'#FFFFFF'});M.setText(m.text);m.disabled?M.disable():M.enable();M.show()}}
function liveMain(text){$('mbb').textContent=text;if(TG)TG.MainButton.setText(text)}
function repLive(){const{t,ws}=repTotal(),T=(s,v)=>document.querySelectorAll(s).forEach(e=>e.textContent=v);curMain=repMain();liveMain(curMain.text);T('#sumV,#totV','от '+rub(t));
 ws.forEach(w=>{const k=CSS.escape(w.id);T(`[data-sub="${k}"]`,rub(workSum(w)));T(`[data-ar="${k}"]`,fmtA(rIt(w.id).area)+' м²')})}
$('mbb').addEventListener('click',()=>{if(curMain&&curMain.fn&&!curMain.disabled)curMain.fn()});
if(TG){TG.MainButton.onClick(()=>{if(curMain&&curMain.fn&&!curMain.disabled)curMain.fn()});TG.BackButton.onClick(back)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act],[data-rw],[data-rm],[data-st],[data-cat],[data-add],[data-flat],[data-di],[data-g],[data-house],[data-og],[data-gal],[data-tr],[data-at],[data-mv],[data-addrow],[data-del],[data-bh],[data-off]');if(!b)return;const d=b.dataset;
 if(d.at){U.adm.tab=d.at;U.adm.msg='';render();return window.scrollTo(0,0)}
 if(d.bh){U.adm.bh=+d.bh;return render()}
 if(d.addrow){const t=NEW[tplKey(d.addrow)];if(t){getP(U.adm.draft,d.addrow).push(t[1]());admDirty();render()}return}
 if(d.del){const arr=getP(U.adm.draft,d.del),i=+d.i,nm=arr[i]&&(arr[i].name||arr[i].title)||'';if(arr.length<2){alert('Последний пункт удалить нельзя — список не может быть пустым.');return}
  const go_=ok=>{if(!ok)return;arr.splice(i,1);admDirty();render()};if(TG&&TG.showConfirm)TG.showConfirm(`Удалить «${nm}»?`,go_);else go_(confirm(`Удалить «${nm}»?`));return}
 if(d.mv){const a=getP(U.adm.draft,d.mv),i=+d.i,j=i+ +d.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];admDirty();return render()}
 if(d.act==='admUndo'){U.adm.draft=null;U.adm.dirty=false;U.adm.msg='';return render()}
 if(d.off){U.off=+d.off;return go('office')}
 if(d.house){bldPick(B.houses.find(x=>x.id===d.house));return go('house')}
 if(d.gal){const g=(U.scr==='flat'?curFlat():house()).gallery[+d.gal],o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="photos/${esc(g.img)}" alt=""><span>${esc(g.caption)}</span>`;o.onclick=()=>o.remove();document.body.append(o);return}
 if(d.og){U.bld.opt[d.og]=d.oi;return render()}
 if(d.tr){U.bld.terr=d.tr;return render()}
 if(d.go)return go(d.go);
 if(d.act==='back')return back();
 if(d.act==='chat')return openChat();
 if(d.act==='take'){U.box.me.status='В работе';if(TG&&TG.HapticFeedback)TG.HapticFeedback.impactOccurred('light');return render()}
 if(d.rm){const u=U.rep;if(d.rm==='all'&&u.mode!=='all'&&!Object.values(u.sel).some(Boolean))u.sel[u.work]=true;u.mode=d.rm;return render()}
 if(d.rw){const u=U.rep;if(u.mode==='all')u.sel[d.rw]=!u.sel[d.rw];else u.work=d.rw;return render()}
 if(d.st){const s=rIt(d.w),m={lamps:[1,R.lampMax],chand:[0,R.chandelierMax],corn:[1,50],led:[1,100]}[d.st];s[d.st]=Math.max(m[0],Math.min(m[1],s[d.st]+ +d.d));return render()}
 if(d.cat){U.cat=d.cat;return render()}
 if(d.add){const q=(U.cart[d.add]||0)+ +d.d;if(q<=0)delete U.cart[d.add];else U.cart[d.add]=q;if(TG&&TG.HapticFeedback)TG.HapticFeedback.impactOccurred('light');return render()}
 if(d.flat){U.flat=d.flat;U.start=U.end=null;U.sv={};U.guests=Math.min(2,curFlat().maxGuests);return go('flat')}
 if(d.di){const i=+d.di,BZ=busyDays(curFlat());if(BZ.has(i))return;if(U.start==null||U.end!=null||i<=U.start){U.start=i;U.end=null}else{let ok=true;for(let j=U.start+1;j<i;j++)if(BZ.has(j))ok=false;if(ok)U.end=i;else{U.start=i;U.end=null}}return render()}
 if(d.g){const f=curFlat();U.guests=Math.max(1,Math.min(f.maxGuests+(f.extraBeds||0),U.guests+ +d.g));return render()}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.inputMode==='tel'){if(e.inputType!=='deleteContentBackward')t.value=phoneMask(t.value);return}
 if(t.dataset.p&&U.adm.draft){const ty=t.dataset.t;setP(U.adm.draft,t.dataset.p,ty==='num'?Math.max(0,+String(t.value).replace(',','.')||0):ty==='bool'?t.checked:t.value);admDirty();return}
 if(t.id==='bW'||t.id==='bL'||t.id==='tD'){const h=house(),k={bW:['w',h.widths],bL:['l',h.lengths],tD:['td',hTerr(h)?.depths]}[t.id];U.bld[k[0]]=nums(k[1])[+t.value];return bldLive()}
 // площадь: ползунок, ввод числом или длина × ширина — всё синхронно
 if(t.dataset.w&&t.dataset.k){const u=rIt(t.dataset.w),k=t.dataset.k,num=x=>parseFloat(String(x).replace(',','.')),q=x=>document.querySelector(`[data-w="${CSS.escape(t.dataset.w)}"][data-k="${x}"]`);
  if(k==='r'){u.area=+t.value;u.L=u.W='';q('n').value=fmtA(u.area);q('L').value=q('W').value=''}
  else if(k==='n'){const v=num(t.value);if(!(v>0))return;u.area=Math.min(1000,Math.round(v*10)/10);u.L=u.W='';q('r').value=clampA(u.area);q('L').value=q('W').value=''}
  else{u.L=q('L').value;u.W=q('W').value;const a=num(u.L)*num(u.W);if(!(a>0))return;u.area=Math.min(1000,Math.round(a*10)/10);q('n').value=fmtA(u.area);q('r').value=clampA(u.area)}
  U.rep.area=u.area;repLive()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.sw&&t.dataset.w){rIt(t.dataset.w)[t.dataset.sw]=t.checked;return render()}
 if(t.dataset.sv){U.sv[t.dataset.sv]=t.checked;return render()}
 if(t.dataset.ex){U.bld.ex[t.dataset.ex]=t.checked;const s=B.button+' · от '+rub(bldTotal().t);liveMain(s);$('bsumV').textContent='от '+rub(bldTotal().t);curMain=scr.house().main}
});

if(TG&&TG.initData&&ADMIN_API)fetch(ADMIN_API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'check',initData:TG.initData})})
 .then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok){IS_OWNER=true;if(U.scr==='home')render()}}).catch(()=>{});
render();
